# Panel de la dueña: los mismos datos y el mismo código del backend, con los archivos del panel.
# Publicar:  (en la raíz) npm run build:panel  y luego  (en api/) npx wrangler deploy -c wrangler.panel.toml
# Queda protegido con Cloudflare Access (cuenta de Google de la dueña).
name = "mezcal-panel"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "../dist/panel/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
# Correo que recibe el aviso de cada reserva nueva
OWNER_EMAIL = "jannethbridge@gmail.com"
# Remitente de los correos (debe ser del dominio verificado en Resend)
FROM_EMAIL = "Mariachi Mezcal <reservas@mariachimezcal.com>"
# Dirección del panel, para el botón "Ver en el panel" del correo
PANEL_URL = "https://mezcal-panel.mezcal-api.workers.dev"
# Páginas que pueden enviar reservas desde otro origen (la página propia no lo necesita)
ALLOWED_ORIGINS = ""
# Cuentas de Google que pueden usar el panel (separadas por coma)
ADMIN_EMAILS = "jannethbridge@gmail.com"
# Cloudflare Access: se completan al proteger el panel
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "mezcal"
# Base de datos real en Cloudflare (creada con `wrangler d1 create mezcal`)
database_id = "29667b18-c218-430d-a42c-9a04331d2911"
migrations_dir = "migrations"
