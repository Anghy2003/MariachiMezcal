# Página pública + backend de reservas de Mariachi Mezcal, en un solo Worker de Cloudflare.
# La página (Angular) se sirve como archivos estáticos; todo lo que empieza por /api lo atiende src/index.ts.
# Publicar:  (en la raíz) npm run build  y luego  (en api/) npx wrangler deploy
# Probar en la computadora:  npm run db:migrate:local  y  npm run dev
# Los secretos (claves) NO van aquí: en la computadora en .dev.vars; en Cloudflare con `wrangler secret put`.

name = "mezcal"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Dominio propio (comprado en Cloudflare). Cloudflare crea el DNS y el candado HTTPS solo.
routes = [
  { pattern = "mariachimezcalcuenca.com", custom_domain = true },
  { pattern = "www.mariachimezcalcuenca.com", custom_domain = true },
]

[assets]
directory = "../dist/mariachi-mezcal/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
# Correo que recibe el aviso de cada reserva nueva
OWNER_EMAIL = "jannethbridge@gmail.com"
# Remitente de los correos (debe ser del dominio verificado en Resend)
FROM_EMAIL = "Mariachi Mezcal <reservas@mariachimezcalcuenca.com>"
# Dirección del panel, para el botón "Ver en el panel" del correo
PANEL_URL = "https://panel.mariachimezcalcuenca.com"
# Páginas que pueden enviar reservas desde otro origen (la página propia no lo necesita)
ALLOWED_ORIGINS = ""
# Cuentas de Google que pueden usar el panel (separadas por coma)
ADMIN_EMAILS = "jannethbridge@gmail.com"
# Cloudflare Access: se completan al proteger el panel
ACCESS_TEAM_DOMAIN = ""
# Calendario donde se agendan las serenatas confirmadas (compartido con la cuenta de servicio)
CALENDAR_ID = "jannethbridge@gmail.com"
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "mezcal"
# Base de datos real en Cloudflare (creada con `wrangler d1 create mezcal`)
database_id = "29667b18-c218-430d-a42c-9a04331d2911"
migrations_dir = "migrations"
